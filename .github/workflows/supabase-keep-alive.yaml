name: Supabase Keep-Alive

on:
  schedule:
    # 2日に1回、UTC 0:00 (JST 9:00) に実行
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [production, development]

    steps:
      - name: Ping Supabase (${{ matrix.environment }})
        env:
          SUPABASE_URL: ${{ matrix.environment == 'production' && secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ matrix.environment == 'production' && secrets.SUPABASE_ANON_KEY_PROD || secrets.SUPABASE_ANON_KEY_DEV }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: Supabase credentials not found for ${{ matrix.environment }}."
            echo "Please ensure SUPABASE_URL_PROD, SUPABASE_ANON_KEY_PROD, SUPABASE_URL_DEV, and SUPABASE_ANON_KEY_DEV are set in GitHub Secrets."
            exit 1
          fi

          echo "Sending keep-alive ping to ${{ matrix.environment }} environment..."

          BODY_FILE=$(mktemp)

          # DBアクティビティを発生させるため、テーブル（例: users）へクエリを送信
          # --retry だけでは DNS 解決失敗などがリトライされないため --retry-all-errors を付ける。
          # シェルは bash -e で動くので、curl の失敗で即終了しないよう終了コードを受け取って判定する。
          CURL_EXIT=0
          HTTP_STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/users?select=id&limit=1") || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "Failed to reach ${{ matrix.environment }} Supabase instance (curl exit code: $CURL_EXIT)."
            echo "See https://curl.se/libcurl/c/libcurl-errors.html (e.g. 6: Couldn't resolve host, 28: Timeout)."
            rm -f "$BODY_FILE"
            exit 1
          fi

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat "$BODY_FILE"
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Successfully pinged ${{ matrix.environment }} Supabase instance."
            rm -f "$BODY_FILE"
          else
            echo "Failed to ping ${{ matrix.environment }} Supabase instance."
            rm -f "$BODY_FILE"
            exit 1
          fi
