apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authwebapp-ingress
spec:
  ingressClassName: public
  rules:
    - host: auth.digitart.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Route to the frontend (SPA) service
                name: authwebapp-frontend-service
                port:
                  number: 80
          - path: /favicon.ico
            pathType: Exact
            backend:
              service:
                name: authwebapp-frontend-service
                port:
                  number: 80
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                # Route versioned backend API requests to backend service
                name: authwebapp-backend-service
                port:
                  number: 5174
          - path: /api
            pathType: Prefix
            backend:
              service:
                # Route non-versioned /api/* to frontend so Next.js server API
                # routes (e.g. /api/roles/*) can run and proxy to the backend
                name: authwebapp-frontend-service
                port:
                  number: 80
          - path: /admin
            pathType: Prefix
            backend:
              service:
                # Serve client-side /admin routes from frontend
                name: authwebapp-frontend-service
                port:
                  number: 80
  tls:
    - hosts:
        - auth.digitart.jp
      # cert-manager が管理するフルチェーン証明書（k8s-certs リポジトリの Certificate auth-digitart-jp）
      secretName: auth-digitart-jp-tls